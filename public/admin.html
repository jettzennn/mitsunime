<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Halaman ini TIDAK boleh terindeks mesin pencari. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Mitsunime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=1.5.10">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0c0f14">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" href="/icons/mitsunime-favicon-1024.png">
  <link rel="stylesheet" href="/css/admin.css?v=1.3.2">
</head>
<body>
  <!-- Halaman login admin (tampil bila belum login sebagai admin) -->
  <div id="admin-login" hidden>
    <main style="min-height:100vh;display:grid;place-items:center;padding:16px">
      <div class="form-panel">
        <h1>Masuk Admin</h1>
        <p class="muted" style="font-size:14px">Hanya untuk pengelola Mitsunime.</p>
        <form id="form-admin-login" novalidate>
          <div class="field">
            <label for="admin-username">Username atau Email</label>
            <input id="admin-username" type="text" autocomplete="username" placeholder="Username atau Email" required>
          </div>
          <div class="field">
            <label for="admin-password">Password</label>
            <div class="pw-wrap">
              <input id="admin-password" type="password" autocomplete="current-password" required>
              <button class="pw-toggle" type="button" aria-label="Lihat password" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <p class="form-error" id="admin-login-error" role="alert"></p>
          <button class="btn btn-primary btn-block" type="submit">Masuk</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Dashboard admin -->
  <div id="admin-app" hidden>
    <div class="admin-shell">
      <aside class="admin-sidebar" id="admin-sidebar" aria-label="Menu admin">
        <div class="admin-logo">Mitsunime</div>
        <nav class="admin-nav" id="admin-nav">
          <a href="#ringkasan" data-section="ringkasan" class="is-active">Ringkasan</a>
          <a href="#pengguna" data-section="pengguna">Pengguna</a>
          <a href="#judul" data-section="judul">Judul</a>
          <a href="#audit" data-section="audit">Log Audit</a>
        </nav>
      </aside>
      <div class="admin-main">
        <div class="admin-top">
          <button class="header-icon-btn hamburger-admin" id="btn-admin-drawer" type="button" aria-label="Buka menu admin">☰</button>
          <div>
            <h1 id="admin-page-title">Ringkasan</h1>
            <span class="muted">Dashboard Admin</span>
          </div>
          <button class="btn btn-danger btn-sm" id="btn-admin-logout" type="button">Keluar</button>
        </div>

        <section data-panel="ringkasan">
          <div id="summary-notice" style="margin-bottom:16px"></div>
          <div class="admin-cards" id="summary-cards"></div>
          <div class="admin-panels">
            <div class="admin-panel">
              <h2>Aktivitas Terakhir</h2>
              <div id="summary-audit"></div>
            </div>
          </div>
        </section>

        <section data-panel="pengguna" hidden>
          <div class="admin-search">
            <input type="search" id="user-search" placeholder="Cari username atau email..." aria-label="Cari pengguna" autocomplete="off">
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>Username</th><th>Email</th><th>Level</th><th>Terdaftar</th></tr></thead>
              <tbody id="user-rows"></tbody>
            </table>
          </div>
          <div class="pagination" id="user-pagination" hidden>
            <button class="btn btn-ghost btn-sm" id="user-prev" type="button">Sebelumnya</button>
            <span class="page-info" id="user-page-info"></span>
            <button class="btn btn-ghost btn-sm" id="user-next" type="button">Berikutnya</button>
          </div>
        </section>

        <section data-panel="judul" hidden>
          <p class="lead">Cari judul, lalu centang <strong>Sub Indo</strong> hanya bila sudah diverifikasi manual.</p>
          <div class="admin-search">
            <input type="search" id="anime-search" placeholder="Cari judul anime..." aria-label="Cari judul anime" autocomplete="off">
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>Poster</th><th>Judul</th><th>Tahun</th><th>Skor</th><th>Sub Indo</th><th></th></tr></thead>
              <tbody id="anime-rows"></tbody>
            </table>
          </div>
        </section>

        <section data-panel="audit" hidden>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>Waktu</th><th>Admin</th><th>Aksi</th><th>Target</th><th>Detail</th></tr></thead>
              <tbody id="audit-rows"></tbody>
            </table>
          </div>
          <div class="pagination" id="audit-pagination" hidden>
            <button class="btn btn-ghost btn-sm" id="audit-prev" type="button">Sebelumnya</button>
            <span class="page-info" id="audit-page-info"></span>
            <button class="btn btn-ghost btn-sm" id="audit-next" type="button">Berikutnya</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=1.5.9"></script>
  <script src="/js/common.js?v=1.5.9"></script>
  <script src="/js/storage.js?v=1.5.2"></script>
  <script src="/js/admin.js?v=1.5.9"></script>
</body>
</html>
