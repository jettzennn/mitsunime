<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail Anime — Mitsunime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=1.5.5">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0c0f14">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <div id="site-header-slot"></div>
  <main class="page-main">
    <div class="shell">
      <div id="page-banner" hidden></div>
      <div id="detail-root"></div>
      <section class="section" id="sec-episodes" hidden>
        <div class="section__head">
          <h2 class="section-title"><span class="accent-word">Daftar</span> Episode</h2>
          <span class="muted" id="ep-count"></span>
        </div>
        <div class="episode-tools">
          <select id="ep-jump-select" aria-label="Lompat ke episode"></select>
          <span class="muted small" id="ep-jump-info"></span>
          <button class="btn btn-ghost btn-sm" id="btn-ep-sort" type="button">Urutan: Naik</button>
        </div>
        <div class="episode-list" id="episode-list"></div>
        <div style="margin-top:16px;text-align:center">
          <button class="btn btn-ghost" id="btn-more-episodes" type="button" hidden>Muat Lebih Banyak</button>
        </div>
      </section>
      <section class="section" id="sec-related" hidden>
        <div class="section__head">
          <h2 class="section-title"><span class="accent-word">Anime</span> Terkait</h2>
        </div>
        <div class="rail-wrap">
          <button class="rail-arrow rail-arrow--left" type="button" data-rail="rail-related" aria-label="Geser ke kiri"></button>
          <div class="rail" id="rail-related"></div>
          <button class="rail-arrow rail-arrow--right" type="button" data-rail="rail-related" aria-label="Geser ke kanan"></button>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer-slot"></div>
  <script src="/js/api.js?v=1.3.2"></script>
  <script src="/js/common.js?v=1.5.4"></script>
  <script src="/js/storage.js?v=1.5.2"></script>
  <script src="/js/detail.js?v=1.5.2"></script>
</body>
</html>
