<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pencarian — Mitsunime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=1.5.10">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0c0f14">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" href="/icons/mitsunime-favicon-1024.png">
</head>
<body>
  <div id="site-header-slot"></div>
  <main class="page-main">
    <div class="shell">
      <div id="page-banner" hidden></div>
      <section class="search-hero">
        <h1 class="page-title">Pencarian</h1>
        <div class="search-box" style="margin-top:16px">
          <span class="searchbar__icon" id="search-icon"></span>
          <input type="search" id="search-input" placeholder="Cari judul anime..." aria-label="Cari judul anime" autocomplete="off">
          <button class="search-clear" id="search-clear" type="button" aria-label="Hapus pencarian" hidden>×</button>
        </div>
        <div class="filters" id="filters">
          <span class="muted small" id="genre-label" style="flex-shrink:0">Genre:</span>
          <span id="genre-chips"></span>
          <select id="filter-status" aria-label="Filter status">
            <option value="">Semua Status</option>
            <option value="Currently Airing">Sedang Tayang</option>
            <option value="Finished Airing">Tamat</option>
            <option value="Not yet aired">Segera Tayang</option>
          </select>
          <select id="filter-year" aria-label="Filter tahun">
            <option value="">Semua Tahun</option>
          </select>
        </div>
        <p class="result-count" id="result-count"></p>
      </section>
      <section class="section" id="sec-results">
        <div class="poster-grid" id="search-results"></div>
        <div class="pagination" id="pagination" hidden>
          <button class="btn btn-ghost btn-sm" id="btn-prev-page" type="button">Sebelumnya</button>
          <span class="page-info" id="page-info"></span>
          <button class="btn btn-ghost btn-sm" id="btn-next-page" type="button">Berikutnya</button>
        </div>
      </section>
      <section class="section" id="sec-explore">
        <h2 class="section-title"><span class="accent-word">Jelajahi</span> Genre</h2>
        <div class="genre-grid" id="genre-grid"></div>
      </section>
      <section class="section" id="sec-az">
        <h2 class="section-title"><span class="accent-word">Daftar</span> A–Z</h2>
        <div class="az-letters" id="az-letters"></div>
      </section>
    </div>
  </main>
  <div id="site-footer-slot"></div>
  <script src="/js/api.js?v=1.5.9"></script>
  <script src="/js/common.js?v=1.5.9"></script>
  <script src="/js/storage.js?v=1.5.2"></script>
  <script src="/js/search.js?v=1.5.2"></script>
</body>
</html>
