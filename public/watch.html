<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tonton — Mitsunime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=1.5.5">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0c0f14">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <div id="site-header-slot"></div>
  <main class="page-main" id="watch-main">
    <div class="shell">
      <div id="page-banner" hidden></div>
      <div class="watch-wrap">
        <div class="player" id="player" tabindex="0" aria-label="Pemutar video">
          <!-- Item 28 (v1.5.5): .player__stage membungkus SEMUA isi visual
               player (video, bar, center, menu, iframe, overlay). Rotasi
               fallback HARUS di sini, bukan di .player — stylesheet UA
               :fullscreen Chrome memaksa transform:none + inset:0 pada
               elemen fullscreen itu sendiri, jadi kelas di .player tidak
               pernah memutar apa pun secara visual (terbukti probe
               2026-11-20: computed transform "none" saat fullscreen). -->
          <div class="player__stage" id="player-stage">
          <video id="player-video" playsinline preload="metadata" hidden></video>
          <!-- Kontrol player custom v1.5.3 (item 13): menggantikan kontrol
               bawaan Chrome HANYA untuk Server HD. Bar + menu satu unit
               dengan satu timer auto-hide; menu ⋮ berisi tiga seksi
               sejajar (Bahasa / Kecepatan / Subtitle). Bila init gagal,
               watch.js mengembalikan atribut controls (kontrol natif). -->
          <div class="player__bar" id="player-bar" hidden>
            <button class="player-btn" id="player-play" type="button" aria-label="Putar">
              <svg class="player-ic player-ic--play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
              <svg class="player-ic player-ic--pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            </button>
            <span class="player-time" id="player-time">0:00 / --:--</span>
            <input class="player-seek" id="player-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Cari posisi video">
            <button class="player-btn" id="player-mute" type="button" aria-label="Bisu">
              <svg class="player-ic player-ic--vol" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <svg class="player-ic player-ic--muted" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="m16 9 5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <input class="player-vol" id="player-vol" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
            <button class="player-btn" id="player-menu-btn" type="button" aria-label="Pengaturan pemutar" aria-haspopup="true" aria-expanded="false">
              <svg class="player-ic" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
            </button>
            <button class="player-btn" id="player-fs" type="button" aria-label="Layar penuh">
              <svg class="player-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </button>
          </div>
          <div class="player__center" id="player-center" hidden>
            <button class="player-center-btn" id="player-center-play" type="button" aria-label="Putar">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
            </button>
          </div>
          <div class="player__menu" id="player-menu" hidden role="dialog" aria-label="Pengaturan pemutar">
            <div class="player-menu__col" id="menu-lang">
              <h3 class="player-menu__title">Bahasa</h3>
              <div class="player-menu__list" id="menu-lang-list"></div>
            </div>
            <div class="player-menu__col" id="menu-speed">
              <h3 class="player-menu__title">Kecepatan</h3>
              <div class="player-menu__list" id="menu-speed-list"></div>
            </div>
            <div class="player-menu__col" id="menu-sub">
              <h3 class="player-menu__title">Subtitle</h3>
              <div id="menu-sub-body"></div>
            </div>
          </div>
          <iframe id="player-iframe" title="Pemutar video" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
          <div class="player__overlay" id="player-overlay" hidden></div>
          </div><!-- /#player-stage -->
        </div>
        <div class="watch-info">
          <h1 id="watch-title">Memuat…</h1>
          <p class="watch-ep" id="watch-ep-title"></p>
          <div class="watch-controls">
            <div class="lang-tabs" id="lang-tabs" role="tablist" aria-label="Bahasa subtitle">
              <button class="lang-tab is-active" type="button" data-lang="sub" role="tab" aria-selected="true">SUB</button>
              <button class="lang-tab" type="button" data-lang="dub" role="tab" aria-selected="false">DUB</button>
            </div>
            <label class="watch-select">
              <span class="sr-only">Pilih server</span>
              <select id="server-select" aria-label="Pilih server"></select>
            </label>
            <div class="server-note" id="server-switch">
              <span class="dot"></span>
              <span>Server: <strong id="server-name">—</strong></span>
              <span id="server-note"></span>
              <button class="btn btn-ghost btn-sm" id="btn-change-server" type="button">Ganti Server</button>
            </div>
          </div>
          <div class="hd-controls" id="hd-controls" hidden>
            <label class="watch-select">
              <span class="sr-only">Subtitle</span>
              <select id="sub-select" aria-label="Pilih subtitle"></select>
            </label>
            <label class="watch-select">
              <span class="sr-only">Kualitas video</span>
              <select id="quality-select" aria-label="Pilih kualitas video"></select>
            </label>
            <button class="btn btn-ghost btn-sm" id="btn-skip-intro" type="button" hidden>Lewati Intro</button>
            <button class="btn btn-ghost btn-sm" id="btn-skip-outro" type="button" hidden>Lewati Outro</button>
            <p class="sub-status" id="sub-status" role="status"></p>
          </div>
          <div class="watch-nav">
            <button class="btn btn-ghost" id="btn-prev" type="button">← Episode Sebelumnya</button>
            <button class="btn btn-primary" id="btn-next" type="button">Episode Berikutnya →</button>
          </div>
        </div>
      </div>
      <section class="section">
        <div class="section__head">
          <h2 class="section-title"><span class="accent-word">Daftar</span> Episode</h2>
          <span class="muted" id="ep-count"></span>
        </div>
        <div class="episode-tools">
          <select id="ep-jump-select" aria-label="Lompat ke episode"></select>
          <span class="muted small" id="ep-jump-info"></span>
          <button class="btn btn-ghost btn-sm" id="btn-ep-sort" type="button">Urutan: Naik</button>
        </div>
        <div class="episode-list" id="episode-list"></div>
        <div style="margin-top:16px;text-align:center">
          <button class="btn btn-ghost" id="btn-more-episodes" type="button" hidden>Muat Lebih Banyak</button>
        </div>
      </section>
      <section class="section" id="sec-related" hidden>
        <div class="section__head">
          <h2 class="section-title"><span class="accent-word">Anime</span> Terkait</h2>
        </div>
        <div class="rail-wrap">
          <button class="rail-arrow rail-arrow--left" type="button" data-rail="rail-related" aria-label="Geser ke kiri"></button>
          <div class="rail" id="rail-related"></div>
          <button class="rail-arrow rail-arrow--right" type="button" data-rail="rail-related" aria-label="Geser ke kanan"></button>
        </div>
      </section>
    </div>
    <div class="autonext-toast" id="autonext-toast" hidden>
      <span>Episode berikutnya mulai dalam <strong id="autonext-count">5</strong> detik</span>
      <button class="btn btn-primary btn-sm" id="btn-autonext-now" type="button">Putar Sekarang</button>
      <button class="btn btn-ghost btn-sm" id="btn-cancel-autonext" type="button">Batalkan</button>
    </div>
  </main>
  <div id="site-footer-slot"></div>
  <script src="/js/api.js?v=1.5.0"></script>
  <script src="/js/common.js?v=1.5.4"></script>
  <script src="/js/storage.js?v=1.5.2"></script>
  <script src="/js/subs.js?v=1.5.4"></script>
  <script src="/js/subprefs.js?v=1.5.3"></script>
  <script src="/js/watch.js?v=1.5.5"></script>
</body>
</html>
